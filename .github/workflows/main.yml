name: Compile ESP32-C3 Audio

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          
      - name: Setup ESP32 Core
        run: |
          arduino-cli config init
          arduino-cli core install esp32:esp32@3.0.7 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          
      - name: Install Standard Libraries
        run: |
          arduino-cli lib install "U8g2"
          arduino-cli lib install "Adafruit BusIO"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "LiquidCrystal"
          arduino-cli lib install "TFT"
          arduino-cli lib install "SD"
          arduino-cli lib install "Servo"
          arduino-cli lib install "Stepper"
          
      - name: Install Custom Audio Library
        run: |
          mkdir -p ~/Arduino/libraries
          cd ~/Arduino/libraries
          curl -L https://codeload.github.com/PLSousa/ESP32-audioI2S/zip/refs/heads/v2.0.6-gcc14-nopsram -o audio.zip
          unzip audio.zip
          rm audio.zip
          
      - name: Compile with Huge App Partition
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:makergo_c3_supermini \
            --build-property build.partitions=huge_app \
            --build-property upload.maximum_size=3145728 \
            --output-dir ./build \
            Esp32-compile.ino
            
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-audio-bin
          path: ./build/*.bin
